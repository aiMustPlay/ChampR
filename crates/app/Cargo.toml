[package]
name = "champr"
version = "0.1.0"
edition = "2021"
build = "build.rs"
# 这个 crate 有第二个 bin(src/bin/ui_preview.rs 无头 UI 预览), 不指定 default-run
# 的话 `cargo run -p champr`(启动器用的命令)会直接报
# "could not determine which binary to run" 并以 101 退出 —— 2026-10-04 全量启动失败事故。
default-run = "champr"

[dependencies]
lcu = { path = "../lcu" }
tokio = { version = "1.44.0", features = ["full"] }
# 关掉 slint 的 accessibility(AccessKit): 2026-10-05 用户机器上 UIA 客户端查询
# 无障碍树时 accesskit_consumer 直接 panic("Focused ID ... is not in the node list"),
# 整个 app 静默退出 —— 表现就是"双击后什么都没有"。我们不需要无障碍支持,
# 因此不用 default-features, 按默认集逐项列出(仅去掉 accessibility)。
slint = { version = "1.15", default-features = false, features = [
    "std",
    "backend-default",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
] }
kv-log-macro = "1.0.7"
femme = "2.2.1"
# 直接依赖 log: 自建"控制台 + 文件"双写 logger(见 main.rs::init_logging)
log = "0.4"
anyhow = "1.0.86"
image = { version = "0.25.2", default-features = false, features = ["png"] }
futures-util = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5"
tray-icon = "0.19"
windows-sys = { version = "0.52", features = [
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # 剪贴板: 自绘的表格/卡片选不中文字, 只能靠"复制"按钮写系统剪贴板
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }

[build-dependencies]
slint-build = "1.15"
embed-resource = "2.5"
