# =============================================================================
# ChampR 兵法心战·英雄卡覆盖
#
# 结构: [[unit]] 卡片只写"这个具体英雄"层面的特别心理/连招/主计;
# 没写卡的英雄自动按其职业分型(archetppe)拿通用战略。
#
# 字段说明:
#   id        — DDragon 英文 id(小写), 如 yasuo / leesin
#   stratagem — 主计, 必须出自三十六计正名(系统会校验, 拼错该卡静默落回分型)
#   combo     — 连招签名: 这个英雄身体语言的"心动节奏"
#   psych     — 心理特点: 对面在操刀这个英雄时想什么、怕什么
#   usage     — 实战用法: 对位时把主计落到操作的一句话
#   reason    — 收录理由: 为什么是这一计(可留空, 但建议写清, 方便他人维护)
#
# 用户级覆盖: %APPDATA%\champr\war-strategy.toml
# 你的文件整体被解析失败时系统回退这份内置默认(警告写入 log)。
# =============================================================================

